name: Probe Hindu
on: { workflow_dispatch: {} }
permissions: { contents: read }
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python3 - <<'PY'
          import json, urllib.request
          def get(u):
              req = urllib.request.Request(u, headers={"User-Agent": "Mozilla/5.0"})
              with urllib.request.urlopen(req, timeout=30) as r:
                  return r.status, r.read()
          root = "https://epaper.thehindu.com/ccidist-ws/th/th_mumbai/"
          s, b = get(root + "issues/")
          j = json.loads(b)
          web = j["issues"]["web"]
          print("issues", s, len(web), [ (i.get("id") or i.get("issueId"), i.get("pageCount"), i.get("title") or i.get("issueTitle"), i.get("publicationDate") or i.get("pubDate")) for i in web[:3] ])
          print("keys", sorted(web[0].keys()))
          iid = web[0]["downloadPagesUrl"].split("/issues/")[1].split("/")[0]
          s, b = get(root + f"issues/{iid}/OPS/cciobjects.json")
          o = json.loads(b); print("objects", s, len(b), o["attributes"].get("PubDateDate"))
          page = o["children"][0]; art = next(c for c in page["children"] if c["kind"] == "Article" and c["attributes"].get("Headline"))
          u = root + f"issues/{iid}/OPS/{page['id']}%2B{art['id']}.html"
          s, b = get(u); print("article", s, len(b), art["attributes"]["Headline"][:60])
          s, b = get(root + f"issues/{iid}/OPS/{page['id']}%2B{page['id']}_pdf.pdf"); print("pagepdf", s, len(b), b[:5])
          PY
