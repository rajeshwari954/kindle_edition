name: Probe Hindu
on: { workflow_dispatch: {} }
permissions: { contents: read }
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: pip install lxml >/dev/null
      - run: |
          python3 - <<'PY'
          import json, re, urllib.request, lxml.html
          def get(u):
              req = urllib.request.Request(u, headers={"User-Agent": "Mozilla/5.0"})
              with urllib.request.urlopen(req, timeout=30) as r: return r.read()
          base = "https://epaper.thehindu.com/ccidist-ws/th/th_mumbai/issues/215307/OPS/"
          o = json.loads(get(base + "cciobjects.json"))
          arts = [(p, c) for p in o["children"] for c in p.get("children", []) if c["kind"] == "Article"]
          for p, c in arts:
              if p["attributes"]["Page"] not in ("1", "10"): continue
              a = c["attributes"]
              t = lxml.html.fromstring(get(base + f"{p['id']}%2B{c['id']}.html")).xpath('string(//div[contains(@class,"body")])')
              t = re.sub(r"\s+", " ", t)
              print(p["attributes"]["Page"], "|", a.get("Headline","")[:40], "|", a.get("Name","")[:40], "| SG", a.get("StoryGroup"), "| SAU", a.get("SameAsUid"), "| JTP", a.get("JumpToPage"), "| JT", a.get("JumpTo"), "| JF", a.get("JumpFrom"), "|", t[:70])
          PY
