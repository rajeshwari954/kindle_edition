name: Probe Hindu
on: { workflow_dispatch: {} }
permissions: { contents: read }
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt >/dev/null
      - env: { ANTHROPIC_API_KEY: "${{ secrets.ANTHROPIC_API_KEY }}" }
        run: |
          python3 - <<'PY'
          import datetime as dt
          import hindu_epaper as h
          st = h.collect("th_mumbai", (dt.datetime.utcnow() + dt.timedelta(hours=5, minutes=30)).date())
          print("WITHPHOTO", sum(1 for s in st if s.get("images")), "of", len(st), "sizes KB", sorted(len(s["images"][0][1])//1024 for s in st if s.get("images"))[-5:])
          PY
