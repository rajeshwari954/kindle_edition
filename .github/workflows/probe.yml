name: Probe channel
on: { workflow_dispatch: {} }
permissions: { contents: read }
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sL -A "Mozilla/5.0 (compatible; kindle-edition)" -w "status %{http_code} final %{url_effective}\n" https://t.me/s/UPSCprepIAS -o page.html
          wc -c page.html
          python3 - <<'PY'
          import re, html
          s = open("page.html", encoding="utf-8").read()
          posts = re.findall(r'<div class="tgme_widget_message [^"]*"[^>]*data-post="([^"]+)"(.*?)(?=<div class="tgme_widget_message_wrap|\Z)', s, re.S)
          print("posts:", len(posts))
          for pid, body in posts[-12:]:
              t = re.search(r'<time datetime="([^"]+)"', body)
              txt = re.search(r'<div class="tgme_widget_message_text[^"]*"[^>]*>(.*?)</div>', body, re.S)
              doc = re.search(r'tgme_widget_message_document_title[^>]*>(.*?)<', body, re.S)
              ph = "photo" if "tgme_widget_message_photo_wrap" in body else ""
              text = html.unescape(re.sub(r"<br/?>", "\n", re.sub(r"<(?!br)[^>]+>", "", txt.group(1)))) if txt else ""
              print("----", pid, t.group(1) if t else "", ph, ("DOC: " + doc.group(1)) if doc else "")
              print(text[:500])
          PY
